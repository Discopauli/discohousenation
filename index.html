<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DHN Radio">
<meta name="theme-color" content="#040517">
<meta name="description" content="Disco House Nation — Live Disco & House Music 24/7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<title>Disco House Nation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040517;
  --bgCard: #212049;
  --bgCard2: #1a1a3e;
  --cyan: #0AC9DB;
  --cyanLight: #6EE8F3;
  --magenta: #E056D7;
  --purple: #7B2FBE;
  --textMuted: rgba(255,255,255,0.5);
  --textDim: rgba(255,255,255,0.3);
  --border: rgba(10,201,219,0.12);
  --borderActive: rgba(10,201,219,0.4);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: #fff;
  display: flex; flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
::-webkit-scrollbar { width: 0; }
button { font-family: inherit; }
a { color: var(--cyan); text-decoration: none; }

/* ═══ ANIMATIONS ═══ */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes barPulse {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}

/* ═══ SPLASH SCREEN ═══ */
#splash {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.5s ease;
}
#splash.hidden { opacity: 0; pointer-events: none; }
#splash .logo { font-size: 72px; animation: spin 3s linear infinite; margin-bottom: 20px;
  filter: drop-shadow(0 0 40px rgba(10,201,219,0.4)) drop-shadow(0 0 20px rgba(224,86,215,0.3)); }
#splash h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
#splash h1 span { color: var(--cyan); }
#splash p { font-size: 10px; color: var(--magenta); font-weight: 600; letter-spacing: 3px; margin-top: 8px; text-transform: uppercase; }

/* ═══ SCREENS ═══ */
.screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 18px 0;
  -webkit-overflow-scrolling: touch;
  background: linear-gradient(180deg, #0d0d2b 0%, var(--bg) 100%);
  display: none;
  animation: fadeIn 0.3s ease;
}
.screen.active { display: block; }

/* ═══ NOW PLAYING BAR ═══ */
#nowPlaying {
  background: linear-gradient(135deg, rgba(33,32,73,0.97), rgba(123,47,190,0.3));
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  border-top: 1px solid var(--borderActive);
  flex-shrink: 0; min-height: 62px;
}
.np-art {
  width: 42px; height: 42px; border-radius: 10px;
  background: linear-gradient(135deg, var(--purple), var(--magenta));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.np-art.playing { animation: spin 3s linear infinite; }
.np-info { flex: 1; min-width: 0; }
.np-label { font-size: 10px; color: var(--cyan); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.np-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--cyan), var(--cyanLight));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #000; flex-shrink: 0; font-weight: 900;
}
.np-vol {
  width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,0.08); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}

/* ═══ BOTTOM NAV ═══ */
#bottomNav {
  background: rgba(4,5,23,0.98); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: space-around;
  border-top: 1px solid rgba(10,201,219,0.08);
  padding: 6px 0 calc(8px + var(--safe-bottom));
  flex-shrink: 0;
}
.nav-btn {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 4px 12px; opacity: 0.4; transition: all 0.2s ease;
}
.nav-btn.active { opacity: 1; transform: scale(1.05); }
.nav-btn .icon { font-size: 22px; }
.nav-btn .label { font-size: 9px; font-weight: 700; color: #666; }
.nav-btn.active .label { color: var(--cyan); }
.nav-dot { width: 4px; height: 4px; border-radius: 2px; background: var(--cyan); }

/* ═══ REUSABLE COMPONENTS ═══ */
.card { background: var(--bgCard); border-radius: 16px; border: 1px solid var(--border); }
.card-glow { border-color: rgba(224,86,215,0.35); background: linear-gradient(135deg, rgba(123,47,190,0.22), rgba(224,86,215,0.1)); box-shadow: 0 4px 20px rgba(224,86,215,0.12); }
.section-title { font-size: 14px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; margin-bottom: 12px; }
.section-line { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.section-line .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

.live-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px;
  background: rgba(220,50,50,0.15); border: 1px solid rgba(220,50,50,0.3);
  font-size: 10px; font-weight: 700; color: #ff5555; letter-spacing: 1px;
}
.live-dot { width: 6px; height: 6px; border-radius: 3px; background: #ff5555; animation: pulse 1.5s ease infinite; }
.you-badge { padding: 3px 8px; border-radius: 6px; font-size: 8px; font-weight: 800; background: rgba(224,86,215,0.2); color: var(--magenta); letter-spacing: 0.5px; border: 1px solid rgba(224,86,215,0.25); }

.chip-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.chip {
  padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600;
  background: var(--bgCard); color: var(--textMuted); cursor: pointer;
  border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0;
  transition: all 0.2s ease;
}
.chip.active { background: linear-gradient(135deg, var(--cyan), var(--cyanLight)); color: #000; border-color: transparent; box-shadow: 0 2px 10px rgba(10,201,219,0.3); }

.visualizer { display: flex; gap: 2px; align-items: flex-end; height: 24px; }
.viz-bar {
  flex: 1; border-radius: 1.5px; transform-origin: bottom;
  animation: barPulse 0.8s ease infinite;
}

/* ═══ INSTALL BANNER ═══ */
#installBanner {
  display: none; padding: 12px 16px; margin: 0 0 12px;
  background: linear-gradient(135deg, rgba(10,201,219,0.1), rgba(123,47,190,0.1));
  border: 1px solid var(--borderActive); border-radius: 14px;
  align-items: center; gap: 10px;
}
#installBanner.show { display: flex; }
#installBanner .msg { flex: 1; font-size: 12px; color: var(--textMuted); }
#installBanner .msg strong { color: #fff; }
#installBtn {
  padding: 6px 16px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--cyan), var(--cyanLight));
  color: #000; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
#installDismiss { background: none; border: none; color: var(--textDim); cursor: pointer; font-size: 16px; }

/* ═══ SPACER ═══ */
.bottom-spacer { height: 20px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- ═══ SPLASH ═══ -->
<div id="splash">
  <div class="logo">🪩</div>
  <h1>DISCO HOUSE <span>NATION</span></h1>
  <p>Loading the groove...</p>
</div>

<!-- ═══ SCREENS ═══ -->
<div class="screen active" id="screen-home"></div>
<div class="screen" id="screen-schedule"></div>
<div class="screen" id="screen-djs"></div>
<div class="screen" id="screen-mixes"></div>
<div class="screen" id="screen-chat"></div>

<!-- ═══ NOW PLAYING ═══ -->
<div id="nowPlaying">
  <div class="np-art playing" id="npArt">🪩</div>
  <div class="np-info">
    <div class="np-label" id="npLabel">● LIVE</div>
    <div class="np-title" id="npTitle">Disco House Nation — 24/7 Disco & House</div>
  </div>
  <button class="np-vol" id="volBtn" onclick="toggleMute()">🔊</button>
  <button class="np-btn" id="playBtn" onclick="togglePlay()">▶</button>
</div>

<!-- ═══ BOTTOM NAV ═══ -->
<div id="bottomNav"></div>

<!-- ═══ AUDIO ═══ -->
<audio id="audioPlayer" preload="none"></audio>

<script>
// ═══════════════════════════════════════════════════════
// DISCO HOUSE NATION PWA
// ═══════════════════════════════════════════════════════

// ── STREAM CONFIG ──
// Confirmed stream URL from AzuraCast public page (port 8172)
const STREAM_URLS = [
  'https://hello.citrus3.com:2020/8172/stream',
];
// Public player page (used as iframe fallback)
const PUBLIC_PLAYER = 'https://hello.citrus3.com:2020/public/discohousenation';
let currentStreamIndex = 0;

// ── DATA ──
const allDJs = [
  { name:"Mark Atkins", aka:"Disco Evangelists", show:"Behind The Groove", slot:"Fri 4–6pm", bio:"Better known on dancefloors as Disco Evangelists — a vibrant fusion of funky, soulful vocal house. Cutting his teeth in the late 90s for Miss Moneypenny's and Fuel.", genre:"Funky / Soulful Vocal House", resident:true },
  { name:"Joshua J", aka:"", show:"Disco's Calling", slot:"Sat 10pm–12am", bio:"Introduced to the Rave Scene in the late 90s in Halifax, Canada. First turntables in 1999, residencies with Courageous Productions & Urban Fuel Records. Now based in Toronto.", genre:"Disco / House", resident:true },
  { name:"Paul Gordon", aka:"DiscoPauli", show:"Disco Back In The House", slot:"Sun 4–6pm", bio:"They say you can't teach an old dog new tricks, but DiscoPauli has been proving that wrong. After 22 years managing tech at @HomePC, he's brought his musical-meets-technical brain to the DHN family.", genre:"Disco House", resident:true, isYou:true },
  { name:"Slazz", aka:"", show:"The Groove Machine Hot Mix Show", slot:"Thu 8–10pm", bio:"Adventures in music began in an experimental indie-rock band. Captivated by the early acid house club scene in London. Renowned for freestyle mixes of underground edits and fresh grooves.", genre:"Underground / Disco House", resident:true },
  { name:"Bobby K", aka:"Twirlessence", show:"Twirlessence!", slot:"Sun 8pm", bio:"DJ and music curator from the U.S. Midwest, shaped by Motown soul, Chicago house and European Hi-NRG. DJing since the early 1980s.", genre:"Funk / Disco / Hi-NRG", resident:true },
  { name:"Omar", aka:"Discolieber", show:"Guest DJ", slot:"Guest", bio:"Influenced by Soul, Jazz, R&B, Disco, House and Deep House. Founder of the extinct Tief Records label. Part of Mexican label Disko Knights.", genre:"Disco / Deep House / Soul", resident:false },
  { name:"Steven Thomson", aka:"DJ Fabulous", show:"Guest DJ", slot:"Guest", bio:"Known for crafting feel-good sets blending soulful house, disco, funky tunes and good grooves. Rooted in rhythm, warmth and positive energy.", genre:"Soulful House / Disco / Funk", resident:false },
  { name:"Peter Marlow", aka:"DJ Pistol Pete", show:"Funky Disco House Midweek Beats", slot:"Wed 8pm", bio:"Rising name in the UK Disco House scene, representing Death By Disco collective out of Loughborough. High energy, feel-good vibes.", genre:"Funky Disco House", resident:true },
  { name:"Dave Newsome", aka:"", show:"Guest DJ", slot:"Guest", bio:"Leeds-based DJ known for eclectic mixes of disco, house and soulful music. Active for over a decade across SoundCloud, Mixcloud and YouTube.", genre:"Disco / House / Soulful", resident:false },
  { name:"Chris Jackson", aka:"Night At The Island", show:"Groove Sanctuary / Laidback Lounge", slot:"Fri 6pm & Sun 6pm", bio:"Co-founder of Disco House Nation. Started DJing in 2021, created Night At The Island. Built DHN to share his love for disco and funk.", genre:"Disco / Funk", resident:true },
  { name:"Paul Mulholland", aka:"St Jude", show:"Guest DJ", slot:"Guest", bio:"Growing up in Glasgow, Scotland — a city that knows how to party — immersed in the sounds of artists who shaped his musical direction.", genre:"Disco / House", resident:false },
  { name:"Tony Blanca", aka:"DJ Tony Blanca", show:"The Dance Zone", slot:"Thu 6pm", bio:"House and disco DJ with pop, latin and jazz influences. From the most up-to-date styles to great tracks from the 1970s disco era.", genre:"House / Disco / Latin", resident:true },
  { name:"DJ Fernie", aka:"", show:"Disco Balls", slot:"Mon 8pm", bio:"Music lover first and foremost. Listening to dance music since Pete Tong's Radio One days. Jumped into the rave scene, mastered mixing at sixteen.", genre:"Dance / House", resident:true },
  { name:"Martyn Hixon", aka:"DJ Hicky", show:"Divine Disco", slot:"Tue 7pm & Fri 10pm", bio:"Co-founder of DHN. Career spans back to 1989, starting at Sloanes Nightclub in Swansea on Technics 1200mk2 turntables which he still owns.", genre:"Disco / House", resident:true },
  { name:"Jamie Ross", aka:"DJ Jamie Ross", show:"Kitchen Beats", slot:"Tue 8:30pm", bio:"Amateur house music DJ whose journey began in the early 2000s. Deep love for funky uplifting grooves and classic house vibes.", genre:"Funky House", resident:true },
  { name:"Phil LoveDisco", aka:"DJ LoveDisco", show:"Drivetime Disco / Sunday Disco Roast", slot:"Wed 6pm & Sun 12pm", bio:"From the moment 16-year-old Phil first saw Saturday Night Fever in Brighton, his fate was sealed. Armed with Chic's Le Freak, the legend began.", genre:"Disco / Funk / Soul", resident:true },
  { name:"Miss G", aka:"DJ Miss G", show:"Let's Go Dancing", slot:"Mon 6pm", bio:"Emerging force in Disco, House and Trance music. Blending vibrant sounds with community and creativity. Inspired by Diana Ross and The Temptations.", genre:"Disco / House / Trance", resident:true },
  { name:"Vincent Galgo", aka:"DJ Vincent Galgo", show:"Bacardisco", slot:"Sat 6pm", bio:"Strongly influenced by Disco. Founder of Mexican label Nine Tails Records, co-owner at Romita Vinyl Store. From Disco to Soul, Indie Dance to Deep House.", genre:"Disco / Soul / Indie Dance", resident:true },
];

const schedule = {
  Monday:[{time:"6pm",dj:"Miss G",show:"Let's Go Dancing"},{time:"8pm",dj:"DJ Fernie",show:"Disco Balls"}],
  Tuesday:[{time:"6pm",dj:"ADRA",show:"Guest Mix Replay"},{time:"7pm",dj:"DJ Hicky",show:"Divine Disco"},{time:"8:30pm",dj:"Jamie Ross",show:"Kitchen Beats"}],
  Wednesday:[{time:"1pm",dj:"Eian Prince",show:"UNVRS"},{time:"6pm",dj:"DJ LoveDisco",show:"Drivetime Disco"},{time:"8pm",dj:"DJ Pistol Pete",show:"Funky Disco House Midweek Beats"}],
  Thursday:[{time:"6pm",dj:"Tony Blanca",show:"The Dance Zone"},{time:"8pm",dj:"Slazz",show:"The Groove Machine Hot Mix Show"},{time:"10pm",dj:"DJ Jay Rock",show:"The Funky Groove Mix"}],
  Friday:[{time:"4pm",dj:"Disco Evangelists",show:"Behind The Groove"},{time:"6pm",dj:"Chris Jackson",show:"Groove Sanctuary"},{time:"9pm",dj:"Sam Shelley",show:"Exclusive Guest Mix"},{time:"10pm",dj:"DJ Hicky",show:"Divine Disco"}],
  Saturday:[{time:"6pm",dj:"Vincent Galgo",show:"Bacardisco"},{time:"10pm",dj:"Joshua J",show:"Disco's Calling"}],
  Sunday:[{time:"12pm",dj:"DJ LoveDisco",show:"Sunday Disco Roast"},{time:"4pm",dj:"DiscoPauli",show:"Disco Back In The House",highlight:true},{time:"6pm",dj:"Chris Jackson",show:"Laidback Lounge"},{time:"8pm",dj:"DJ Bobby K",show:"Twirlessence!"}],
};

const mixes = [
  {dj:"DiscoPauli",title:"Sunday Sessions Vol.12",duration:"1hr 22m",plays:"2.4k",date:"Feb 16"},
  {dj:"Chris Jackson",title:"Groove Sanctuary Live",duration:"2hr 05m",plays:"3.1k",date:"Feb 14"},
  {dj:"DJ Hicky",title:"Divine Disco #48",duration:"1hr 45m",plays:"1.8k",date:"Feb 13"},
  {dj:"Slazz",title:"Hot Mix Show Special",duration:"1hr 30m",plays:"2.1k",date:"Feb 12"},
  {dj:"Miss G",title:"Let's Go Dancing Mix",duration:"1hr 15m",plays:"1.5k",date:"Feb 10"},
  {dj:"Disco Evangelists",title:"Behind The Groove #20",duration:"2hr 00m",plays:"1.9k",date:"Feb 7"},
  {dj:"Bobby K",title:"Twirlessence! Live",duration:"1hr 40m",plays:"1.2k",date:"Feb 2"},
];

// ── STATE ──
let currentScreen = 'home';
let selectedDay = new Date().toLocaleDateString('en-GB',{weekday:'long'});
if (!schedule[selectedDay]) selectedDay = 'Sunday';
let expandedDJ = null;
let djFilter = 'All';
let isPlaying = false;
let isMuted = false;

const audio = document.getElementById('audioPlayer');
const navItems = [{id:'home',icon:'🏠',label:'Home'},{id:'schedule',icon:'📅',label:'Schedule'},{id:'djs',icon:'🎧',label:'DJs'},{id:'mixes',icon:'🎵',label:'Mixes'},{id:'chat',icon:'💬',label:'Social'}];
const dayNames = Object.keys(schedule);
const shortDays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// ── AUDIO CONTROLS ──
function tryStream(index) {
  if (index >= STREAM_URLS.length) {
    // All direct URLs failed — show iframe player as last resort
    showIframePlayer();
    return;
  }
  currentStreamIndex = index;
  audio.src = STREAM_URLS[index];
  audio.play().then(() => {
    isPlaying = true;
    updateNowPlaying();
    console.log('Stream connected:', STREAM_URLS[index]);
  }).catch(e => {
    console.log('Stream failed:', STREAM_URLS[index], e.message);
    tryStream(index + 1);
  });
}

function showIframePlayer() {
  // Fallback: open the AzuraCast public player
  isPlaying = true;
  updateNowPlaying();
  // Insert iframe player above now-playing bar
  let iframe = document.getElementById('streamIframe');
  if (!iframe) {
    const container = document.createElement('div');
    container.id = 'iframeContainer';
    container.style.cssText = 'position:fixed;bottom:134px;left:12px;right:12px;z-index:45;border-radius:14px;overflow:hidden;border:1px solid var(--borderActive);box-shadow:0 8px 30px rgba(0,0,0,0.5);';
    container.innerHTML = `
      <div style="background:var(--bgCard);padding:8px 12px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:10px;color:var(--cyan);font-weight:700">STREAM PLAYER</span>
        <button onclick="closeIframePlayer()" style="background:none;border:none;color:var(--textDim);cursor:pointer;font-size:16px">✕</button>
      </div>
      <iframe id="streamIframe" src="${PUBLIC_PLAYER}" style="width:100%;height:180px;border:none;background:#1a1a2e"></iframe>
    `;
    document.body.appendChild(container);
  }
}

function closeIframePlayer() {
  const c = document.getElementById('iframeContainer');
  if (c) c.remove();
  isPlaying = false;
  updateNowPlaying();
}

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    audio.src = '';
    isPlaying = false;
    closeIframePlayer();
    updateNowPlaying();
  } else {
    currentStreamIndex = 0;
    tryStream(0);
  }
}

function toggleMute() {
  isMuted = !isMuted;
  audio.muted = isMuted;
  document.getElementById('volBtn').textContent = isMuted ? '🔇' : '🔊';
}

function updateNowPlaying() {
  const art = document.getElementById('npArt');
  const btn = document.getElementById('playBtn');
  const label = document.getElementById('npLabel');
  art.className = isPlaying ? 'np-art playing' : 'np-art';
  btn.textContent = isPlaying ? '⏸' : '▶';
  label.innerHTML = isPlaying ? '<span class="live-dot" style="width:5px;height:5px;border-radius:50%;background:#ff5555;display:inline-block;animation:pulse 1.5s ease infinite;margin-right:4px"></span> LIVE' : '● PRESS PLAY';

  // Update "Now Playing" based on current schedule
  const now = new Date();
  const today = now.toLocaleDateString('en-GB',{weekday:'long'});
  const hour = now.getHours();
  const todayShows = schedule[today] || [];
  let currentShow = null;
  todayShows.forEach(s => {
    const h = parseInt(s.time);
    const isPM = s.time.includes('pm');
    let showHour = isPM && h !== 12 ? h + 12 : h;
    if (showHour <= hour) currentShow = s;
  });
  if (currentShow && isPlaying) {
    document.getElementById('npTitle').textContent = currentShow.dj + ' — ' + currentShow.show;
  } else if (isPlaying) {
    document.getElementById('npTitle').textContent = 'Disco House Nation — 24/7 Mixes';
  } else {
    document.getElementById('npTitle').textContent = 'Tap play to start listening';
  }
}

// ── NAVIGATION ──
function setScreen(id) {
  currentScreen = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  renderScreen(id);
  renderNav();
  document.getElementById('screen-' + id).scrollTop = 0;
}

function renderNav() {
  document.getElementById('bottomNav').innerHTML = navItems.map(n =>
    `<button class="nav-btn ${currentScreen===n.id?'active':''}" onclick="setScreen('${n.id}')">
      <span class="icon">${n.icon}</span>
      <span class="label">${n.label}</span>
      ${currentScreen===n.id?'<div class="nav-dot"></div>':''}
    </button>`
  ).join('');
}

// ── HELPERS ──
function vizBars(count) {
  const colors = ['var(--cyan)','var(--magenta)','var(--purple)'];
  return Array.from({length:count},(_,i) => {
    const h = 6+Math.random()*18;
    const delay = (Math.random()*0.8).toFixed(2);
    const dur = (0.5+Math.random()*0.6).toFixed(2);
    return `<div class="viz-bar" style="height:${h}px;background:${colors[i%3]};opacity:${(0.4+Math.random()*0.5).toFixed(2)};animation-delay:${delay}s;animation-duration:${dur}s"></div>`;
  }).join('');
}

// ── SCREEN RENDERERS ──
function renderScreen(id) {
  const el = document.getElementById('screen-' + id);
  switch(id) {
    case 'home': el.innerHTML = renderHome(); break;
    case 'schedule': el.innerHTML = renderSchedule(); break;
    case 'djs': el.innerHTML = renderDJs(); break;
    case 'mixes': el.innerHTML = renderMixes(); break;
    case 'chat': el.innerHTML = renderChat(); break;
  }
}

function renderHome() {
  // Figure out what's on now and next
  const now = new Date();

// ── PWA INSTALL ──
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (banner) banner.classList.add('show');
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r => {
      deferredPrompt = null;
      dismissInstall();
    });
  }
}
function dismissInstall() {
  const b = document.getElementById('installBanner');
  if (b) b.classList.remove('show');
}

// ── SERVICE WORKER (only works when hosted on a real server) ──
if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.includes('claudeusercontent')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── INIT ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    setTimeout(() => document.getElementById('splash').remove(), 500);
  }, 1500);

  renderNav();
  renderScreen('home');
  updateNowPlaying();
});

// Update now playing info periodically
setInterval(updateNowPlaying, 30000);

// Handle audio errors — try next stream URL
audio.addEventListener('error', () => {
  if (isPlaying) {
    tryStream(currentStreamIndex + 1);
  }
});
</script>
