// ── NOW PLAYING FROM AZURACAST ──
async function fetchNowPlaying() {
  try {
    const resp = await fetch('/.netlify/functions/nowplaying');
    if (!resp.ok) throw new Error('fetch failed');
    const data = await resp.json();
    nowPlayingData = data;
    updateNowPlaying();
  } catch(e) {
    console.log('Now playing fetch failed:', e.message);
  }
}

function updateNowPlaying() {
  const btn = document.getElementById('playBtn');
  const label = document.getElementById('npLabel');
  const title = document.getElementById('npTitle');
  const subtitle = document.getElementById('npSubtitle');
  const artImg = document.getElementById('npArtImg');
  const npArt = document.getElementById('npArt');

  npArt.className = isPlaying ? 'np-art playing' : 'np-art';
  btn.textContent = isPlaying ? '⏸' : '▶';

  if (!isPlaying) {
    label.innerHTML = '● PRESS PLAY';
    title.textContent = 'Tap play to start listening';
    subtitle.textContent = '';
    return;
  }

  label.innerHTML = '<span class="live-dot" style="width:5px;height:5px;border-radius:50%;background:#ff5555;display:inline-block;animation:pulse 1.5s ease infinite;margin-right:4px"></span> LIVE';

  const np = nowPlayingData;
  if (np && !np.error) {
    if (np.is_live && np.live_name) {
      title.textContent = np.live_name + ' — LIVE';
      subtitle.textContent = (np.artist && np.title) ? np.artist + ' — ' + np.title : 'On Air Now';
    } else if (np.title) {
      title.textContent = np.artist || 'Disco House Nation';
      subtitle.textContent = np.title;
    } else {
      title.textContent = 'Disco House Nation';
      subtitle.textContent = '24/7 Disco & House';
    }
    if (np.art && np.art !== artImg.src) {
      artImg.src = np.art;
      artImg.onerror = () => { artImg.src = 'icons/logo.png'; };
    }
  } else {
    const now = new Date();
    const today = now.toLocaleDateString('en-GB',{weekday:'long'});
    const hour = now.getHours();
    const todayShows = schedule[today] || [];
    let currentShow = null;
    todayShows.forEach(s => {
      const h = parseInt(s.time);
      const isPM = s.time.includes('pm');
      let showHour = isPM && h !== 12 ? h + 12 : h;
      if (showHour <= hour) currentShow = s;
    });
    title.textContent = currentShow ? currentShow.dj + ' — ' + currentShow.show : 'Disco House Nation — 24/7 Mixes';
    subtitle.textContent = '';
  }

  const homeDJ = document.getElementById('homeCurrentDJ');
  const homeShow = document.getElementById('homeCurrentShow');
  if (homeDJ && homeShow) {
    homeDJ.textContent = title.textContent;
    homeShow.textContent = subtitle.textContent || 'Live on Disco House Nation';
  }
}

function tryStream(index) {
  if (index >= STREAM_URLS.length) { showIframePlayer(); return; }
  currentStreamIndex = index;
  audio.src = STREAM_URLS[index];
  audio.play().then(() => {
    isPlaying = true;
    updateNowPlaying();
    fetchNowPlaying();
  }).catch(e => { tryStream(index + 1); });
}

function showIframePlayer() {
  isPlaying = true;
  updateNowPlaying();
  let iframe = document.getElementById('streamIframe');
  if (!iframe) {
    const container = document.createElement('div');
    container.id = 'iframeContainer';
    container.style.cssText = 'position:fixed;bottom:134px;left:12px;right:12px;z-index:45;border-radius:14px;overflow:hidden;border:1px solid var(--borderActive);box-shadow:0 8px 30px rgba(0,0,0,0.5);';
    container.innerHTML = `<div style="background:var(--bgCard);padding:8px 12px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:10px;color:var(--cyan);font-weight:700">STREAM PLAYER</span><button onclick="closeIframePlayer()" style="background:none;border:none;color:var(--textDim);cursor:pointer;font-size:16px">✕</button></div><iframe id="streamIframe" src="${PUBLIC_PLAYER}" style="width:100%;height:180px;border:none;background:#1a1a2e"></iframe>`;
    document.body.appendChild(container);
  }
}

  if (isPlaying) {

    tryStream(0);
  }
}

function vizBars(count) {
  const colors = ['var(--cyan)','var(--magenta)','var(--purple)'];
  return Array.from({length:count},(_,i) => {
    const h = 6+Math.random()*18;
    const delay = (Math.random()*0.8).toFixed(2);
    const dur = (0.5+Math.random()*0.6).toFixed(2);
    return `<div class="viz-bar" style="height:${h}px;background:${colors[i%3]};opacity:${(0.4+Math.random()*0.5).toFixed(2)};animation-delay:${delay}s;animation-duration:${dur}s"></div>`;
  }).join('');
}

function renderScreen(id) {
  const el = document.getElementById('screen-' + id);
  switch(id) {
    case 'home': el.innerHTML = renderHome(); break;
    case 'schedule': el.innerHTML = renderSchedule(); break;
    case 'djs': el.innerHTML = renderDJs(); break;
    case 'mixes': el.innerHTML = renderMixes(); break;
    case 'chat': el.innerHTML = renderChat(); break;
  }
}

function timeToMins(timeStr) {
  const m = timeStr.match(/(\d+)(?:[,:.]+(\d+))?\s*(am|pm)/i);
  if (!m) return 0;
  let h = parseInt(m[1]);
  const mins = parseInt(m[2] || 0);
  const isPM = m[3].toLowerCase() === 'pm';
  if (isPM && h !== 12) h += 12;
  if (!isPM && h === 12) h = 0;
  return h * 60 + mins;
}

    reg.update();
    setInterval(() => reg.update(), 5 * 60 * 1000);
  }).catch(() => {});
}

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    setTimeout(() => document.getElementById('splash').remove(), 500);
  }, 1500);
  renderNav();
  renderScreen('home');
  updateNowPlaying();
  fetchNowPlaying();
});

// Refresh now playing every 15 seconds
setInterval(fetchNowPlaying, 15000);

audio.addEventListener('error', () => {
  if (isPlaying) tryStream(currentStreamIndex + 1);
});
</script>
</body>
</html>
